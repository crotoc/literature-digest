<header class="navbar navbar-expand-md navbar-light d-print-none">
  <div class="container-xl">
    <span class="navbar-brand">literature-digest</span>
    <div class="navbar-nav flex-row flex-fill">
      {% for item in nav_items %}
        <div class="nav-item">
          <a class="nav-link{% if item.key == active_nav %} active{% endif %}" href="{{ item.path }}">{{ item.label }}</a>
        </div>
      {% endfor %}
    </div>
  </div>
</header>
