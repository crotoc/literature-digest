{% extends "base.html" %}
{% block title %}文件夹 · literature-digest{% endblock %}
{% block content %}
  <h2 class="mb-3">文件夹</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <div class="card mb-3">
    {% if not tree %}
      <div class="card-body">
        <p class="muted mb-0">还没有文件夹。</p>
      </div>
    {% else %}
      <ul class="folder-tree list-group list-group-flush">
        {% for folder, depth in tree %}
          <li class="list-group-item folder-row" style="padding-left: {{ 1 + depth * 1.5 }}rem;">
            <span class="folder-name">{{ folder.name }}</span>

            <form method="post" class="folder-inline-form" action="/l/{{ slug_and_id }}/folders/{{ folder.id }}/rename">
              <input type="text" name="name" value="{{ folder.name }}" size="16" class="form-control form-control-sm">
              <button type="submit" class="btn btn-sm">改名</button>
            </form>

            <form method="post" class="folder-inline-form" action="/l/{{ slug_and_id }}/folders/{{ folder.id }}/move">
              <select name="new_parent_folder_id" class="form-select form-select-sm">
                <option value="">（根层）</option>
                {% for other in folders %}
                  {% if other.id != folder.id %}
                    <option value="{{ other.id }}" {% if other.id == folder.parent_folder_id %}selected{% endif %}>
                      {{ other.name }}
                    </option>
                  {% endif %}
                {% endfor %}
              </select>
              <button type="submit" class="btn btn-sm">移动</button>
            </form>

            <form method="post" class="folder-inline-form" action="/l/{{ slug_and_id }}/folders/{{ folder.id }}/delete">
              <button type="submit" class="btn btn-sm btn-outline-danger">删除（含子文件夹）</button>
            </form>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>

  <div class="card">
    <div class="card-header"><strong>新建文件夹</strong></div>
    <div class="card-body">
      <form method="post" class="folder-create-form" action="/l/{{ slug_and_id }}/folders/create">
        <input type="text" name="name" placeholder="文件夹名" required class="form-control">
        <select name="parent_folder_id" class="form-select">
          <option value="">（根层）</option>
          {% for folder, depth in tree %}
            <option value="{{ folder.id }}">{{ "　" * depth }}{{ folder.name }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary">新建</button>
      </form>
    </div>
  </div>
{% endblock %}
