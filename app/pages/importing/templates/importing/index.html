{% extends "base.html" %}
{% block title %}导入 · literature-digest{% endblock %}
{% block content %}
  <div class="card">
    <h1>导入文献</h1>
    <p class="muted">粘贴一段 RIS / BibTeX / CSL-JSON 文本，解析后按标识符自动合并或新建。</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/import">
      <div class="form-field">
        <label for="format">格式</label>
        <select id="format" name="format">
          {% for f in formats %}
            <option value="{{ f }}" {% if f == format %}selected{% endif %}>{{ f }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-field">
        <label for="raw_text">文本内容</label>
        <textarea id="raw_text" name="raw_text" rows="14" required>{{ raw_text or "" }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">开始导入</button>
    </form>
    <p class="form-footer"><a href="/library">返回文献库</a></p>
  </div>
{% endblock %}
