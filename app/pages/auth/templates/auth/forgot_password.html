{% extends "base.html" %}
{% block title %}忘记密码 · literature-digest{% endblock %}
{% block content %}
  <div class="card card-md card-narrow">
    <div class="card-body">
      <h2 class="card-title">忘记密码</h2>
      {% if smtp_configured %}
        <form method="post" action="/forgot-password" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">注册邮箱</label>
            <input type="email" class="form-control" name="email" required autofocus>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">发送重置链接</button>
          </div>
        </form>
      {% else %}
        <div class="alert alert-info">密码重置功能当前不可用（站点未配置邮件服务），请联系管理员处理。</div>
      {% endif %}
    </div>
  </div>
  <p class="text-center text-secondary mt-3"><a href="/login">返回登录</a></p>
{% endblock %}
