{% extends "base.html" %}
{% block title %}忘记密码 · literature-digest{% endblock %}
{% block content %}
  <div class="card card-narrow">
    <h1>忘记密码</h1>
    {% if smtp_configured %}
      <form method="post" action="/forgot-password">
        <label class="form-field">
          <span>注册邮箱</span>
          <input type="email" name="email" required autofocus>
        </label>
        <button type="submit" class="btn btn-primary">发送重置链接</button>
      </form>
    {% else %}
      <p class="alert alert-notice">密码重置功能当前不可用（站点未配置邮件服务），请联系管理员处理。</p>
    {% endif %}
    <p class="form-footer"><a href="/login">返回登录</a></p>
  </div>
{% endblock %}
