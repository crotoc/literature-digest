{% extends "base.html" %}
{% block title %}登录 · literature-digest{% endblock %}
{% block content %}
  <div class="card card-md card-narrow">
    <div class="card-body">
      <h2 class="card-title">登录</h2>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" action="/login" autocomplete="off">
        <div class="mb-3">
          <label class="form-label">用户名或邮箱</label>
          <input type="text" class="form-control" name="username_or_email" value="{{ username_or_email or '' }}" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100">登录</button>
        </div>
      </form>
    </div>
  </div>
  <p class="text-center text-secondary mt-3">
    还没有账号？<a href="/register">注册一个</a> · <a href="/forgot-password">忘记密码？</a>
  </p>
{% endblock %}
