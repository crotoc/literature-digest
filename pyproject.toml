[project]
name = "literature-digest-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pymysql>=1.1",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "pypdf>=5.1",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["infra*", "caps*", "domain*", "adapters*", "features*", "app*"]

[tool.pytest.ini_options]
testpaths = ["caps", "domain", "adapters", "features", "app", "tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI 的 Depends(...)/Query(...) 当默认参数值是框架本身的设计（每次请求
# 重新解析，不是会被意外共享的可变默认值），B008 不认识这个例外，这里显式
# 放行，不是关掉整条规则。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]
